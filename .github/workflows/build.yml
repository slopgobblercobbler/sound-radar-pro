name: SoundRadar Pro CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle Loom
        run: ./gradlew build --info

      - name: Verify Standalone Test Suite
        run: python3 run_standalone_tests.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sound-radar-pro-artifacts
          path: build/libs/*.jar
